name: Hugo Build
description: Builds documentation using Hugo
inputs:
    base-url:
        required: false
        description: Optional base url used during build
    working-directory:
        required: false
        description: Path to documentation directory
        default: docs
    hugo-env:
        required: false
        description: Environment variable
        default: public

runs:
    using: "composite"
    steps:
        - name: Setup Hugo
          uses: peaceiris/actions-hugo@v3.2.1
          with:
              # The theme needs Hugo >= 0.156 (themes/gd-docs-theme-next/hugo.toml); keep this
              # equal to the hugo-extended version in docs/package.json.
              hugo-version: "0.167.0"
              extended: true
        - name: Install dependencies
          working-directory: ${{ inputs.working-directory }}
          run: npm ci
          shell: bash
        - name: Build
          working-directory: ${{ inputs.working-directory }}
          env:
              HUGO_ENV: ${{ inputs.hugo-env }}
              BASE_URL: ${{ inputs.base-url }}
          run: hugo --minify ${BASE_URL:+--baseURL $BASE_URL}
          shell: bash
