name: Release ~ Release patch version
on:
  workflow_dispatch:
      inputs:
        version:
            required: true
            description: "Specify the 9.x minor version to patch (example: 9.9.0). gooddata-ui-sdk releases only 9.x, release the newer versions from gdc-ui."
            type: string
        use-npm-token:
            required: false
            default: false
            description: "Publish to npm the old way with NPM_PUBLISH_TOKEN instead of trusted publishing (OIDC)"
            type: boolean

jobs:
    check-input-version-param:
        runs-on: ubuntu-latest
        outputs:
            branch: ${{ steps.check-input-version-param.outputs.branch }}
        steps:
            # gooddata-ui-sdk releases only the 9.x (bear) versions. Release the newer versions from gdc-ui.
            - name: Check that the version is 9.x
              run: |
                  if [[ ! "$VERSION" =~ ^9\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::gooddata-ui-sdk releases only the 9.x (bear) versions, not ${VERSION}. Release the newer versions from gdc-ui."
                    exit 1
                  fi
              env:
                  VERSION: ${{ inputs.version }}
            - name: Checkout code
              uses: actions/checkout@v7.0.1
            - name: Check branch for version exists
              id: check-input-version-param
              run: |
                  base="rel/${VERSION%.*}"
                  if git ls-remote --heads origin ${base} | grep ${base}; then
                    echo "Branch ${base} exists for version ${VERSION}"
                    echo "branch=${base}" >> $GITHUB_OUTPUT
                  else
                    echo "Branch ${base} does not exist for release ${VERSION} on remote, aborting release"
                    exit 1
                  fi
              env:
                  VERSION: ${{ inputs.version }}

    gate-approval:
        needs: check-input-version-param
        runs-on: ubuntu-latest
        environment:
            name: production
        steps:
            - run: echo "Initiating approval"


    publish-release-npm:
      needs: [gate-approval, check-input-version-param]
      uses: ./.github/workflows/rw-perform-release-patch.yml
      permissions:
        pull-requests: write
        contents: write
        id-token: write
      secrets: inherit
      with:
        source-branch: ${{needs.check-input-version-param.outputs.branch}}
        use-trusted-publishing: ${{ inputs.use-npm-token != true }}
