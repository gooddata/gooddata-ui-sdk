name: rw ~ Rush ~ Publish version
on:
    workflow_call:
        inputs:
            source-branch:
                required: true
                description: "The name of the source branch"
                type: string
            release-tag:
                required: true
                description: "The release NPM tag e.g. prerelease, latest, hotfix ..."
                type: string
            use-trusted-publishing:
                required: false
                default: true
                description: "Publish to npm via trusted publishing (OIDC) only, without NPM_PUBLISH_TOKEN"
                type: boolean

jobs:
    publish-version:
        runs-on:
            group: infra1-runners-arc
            labels: runners-rxa-xlarge
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                ref: ${{inputs.source-branch}}
            - name: Add repository to git safe directories to avoid dubious ownership issue
              run: git config --global --add safe.directory $GITHUB_WORKSPACE
            - name: Git config user
              uses: snow-actions/git-config-user@v1.0.0
              with:
                name: git-action
                email: git-action@gooddata.com
            - name: Setup rush
              env:
                NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              uses: ./.github/actions/rush/set-up-rush
            - name: Rush build
              run: |
                  node common/scripts/install-run-rush.js build --parallelism 4
            - name: Rush publish dry run
              run: |
                  node common/scripts/install-run-rush.js publish --include-all --version-policy sdk --set-access-level public
            - name: Rush publish
              if: ${{ !inputs.use-trusted-publishing }}
              uses: nick-fields/retry@v4.0.0
              env:
                  NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
                  TAG: ${{ inputs.release-tag }}
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  retry_wait_seconds: 10
                  command: |
                      node common/scripts/install-run-rush.js publish --publish --include-all --version-policy sdk --tag $TAG --set-access-level public

            # Trusted publishing: npm does not support self-hosted runners and the npm tokens
            # work only on them. So pack here and publish in publish-version-trusted.
            # The action comes from master, because the source branch (e.g. an old rel/X.Y)
            # does not always have it.
            - name: Pack for trusted publishing
              if: ${{ inputs.use-trusted-publishing }}
              uses: gooddata/gooddata-ui-sdk/.github/actions/rush/pack-for-publish@master
              with:
                  policies: "sdk"
                  artifact-name: npm-tarballs-${{ inputs.release-tag }}
                  npm-auth-token: ${{ secrets.NPM_TOKEN }}

    publish-version-trusted:
        if: ${{ inputs.use-trusted-publishing }}
        needs: publish-version
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Publish tarballs with trusted publishing
              uses: gooddata/gooddata-ui-sdk/.github/actions/npm/publish-tarballs@master
              with:
                  artifact-name: npm-tarballs-${{ inputs.release-tag }}
                  release-tag: ${{ inputs.release-tag }}

    notify-publish-failed-to-slack:
        if: ${{ !cancelled() && (needs.publish-version.result == 'failure' || needs.publish-version-trusted.result == 'failure') }}
        needs: [publish-version, publish-version-trusted]
        runs-on: [ubuntu-latest]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                token: ${{ secrets.TOKEN_GITHUB_YENKINS}}
            - name: Inform to slack when publish workflows failed
              uses: ./.github/actions/slack/send-notification
              with:
                  message: ":warning: Publish to NPM in *gooddata-ui-sdk* encountered an error during execution. Check the *<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|log here>* for further information."
                  slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
