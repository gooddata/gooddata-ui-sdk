theme = ["gd-docs-theme-next"]
contentDir = "content/en/"

# The versioned site (master + every rel/* branch) can exceed Hugo's default
# 30s per-page render limit under CI load; give heavy pages more headroom.
timeout = "300s"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Necessary for proper static path resolution
# when baseUrl has some path component.
canonifyURLs = true

# Disable, it makes problems with Netlify (missing internal redirect .../path -> .../path/)
# relativeURLs = true

# "taxonomyTerm" was renamed "term" in Hugo 0.73 and warns on every build
disableKinds = ["taxonomy", "term"]

# The theme's Tailwind v4 (css.TailwindCSS) pipeline declares
# `@source "hugo_stats.json"` in main.css.tmpl, so Hugo has to write that class
# list and mount it where the CSS pipeline can read it. Required by the theme
# contract (INTEGRATION.md §2). The compiled CSS is byte-identical today,
# because Tailwind's automatic source detection already scans the theme
# directory the stylesheet lives in — but it does not see classes that appear
# only in gdc-ui's own layouts, shortcodes or content, and hugo_stats.json is
# what covers those.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.156.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"
    disableWatch = true


[frontmatter]
lastmod = ["date", ":fileModTime"]
# Image processing configuration.
[imaging]
resampleFilter = "CatmullRom"
anchor = "smart"
[imaging.jpeg]
quality = 75
[imaging.webp]
quality = 75

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
      # Chroma writes CSS classes, not inline colours: the theme styles code blocks
      # through its syntax tokens (data/brand.json). This used to come from the old
      # pygmentsUseClasses key.
      noClasses = false
      # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
      style = "tango"
      # Uncomment if you want your chosen highlight style used for code blocks without a specified language
      # guessSyntax = "true"

[languages]
[languages.en]
title = "GoodData.UI"
label = "English"
# Weight used for sorting.
weight = 1

[menu]
[[menu.main]]
name = "Learn"
url = "https://www.gooddata.ai/learn/"
weight = 1
[menu.main.params]
    isMobileTitle = true
    mobileOnly = true
[[menu.main]]
name = "University"
url = "https://university.gooddata.com/"
weight = 2
[[menu.main]]
name = "Community"
url = "https://community.gooddata.com/"
weight = 3
[[menu.main]]
name = "Documentation"
url = "https://www.gooddata.ai/docs/"
weight = 4
[menu.main.params]
    isHome = true
[[menu.main]]
name = "Support"
url = "https://support.gooddata.com/hc/en-us"
weight = 5
[[menu.main]]
name = "Go to GoodData.com"
url = "https://www.gooddata.ai/"
weight = 6
[menu.main.params]
    mobileOnly = true

[outputs]
home = [ "HTML", "REDIR", "LLMS" ]
# Every page and section also renders a clean Markdown copy at <URL>index.md for agents
# (https://llmstxt.org/; MARKDOWN format and templates in gd-docs-theme-next). Set here, not per
# page, so a new page gets one without any frontmatter. API reference member pages (a property, a
# method: ~8k of the ~12k symbol pages) are not published at all (`folded`, `build.render: link`,
# set by scripts/generate-reference.ts): their content is a section of their parent symbol's page.
section = [ "HTML", "MARKDOWN" ]
page = [ "HTML", "MARKDOWN" ]

# Older versions (/11.61/, ... in the versioned build) get no Markdown copies: llms.txt and agents
# use the current docs only, and a copy per page doubles the files of every version's API
# reference (~5.6k pages each), which the Netlify deploy pays for. A page's own `outputs` wins.
[[cascade]]
outputs = [ "HTML" ]
[cascade.target]
path = "{/[0-9]*,/[0-9]*/**}"

# Every version's root page (/latest/, /11.62/, ...) is a docs page like the
# rest. The section's own cascade (its _index.md) sets type for the pages below it, not for itself.
[[cascade]]
type = "docs"
[cascade.target]
kind = "section"
path = "/*"

# Site params live in params.toml.

[deployment]
[[deployment.targets]]
name = "s3deployment"
URL = "s3://tiger-docs-dev-s3bucket-8js43h2g3crv?region=us-east-1"
cloudFrontDistributionID = "E11AIHJE0DRPJH"

[[deployment.matchers]]
#  Cache static assets for 1 year.
pattern = "^.+\\.(js|css|svg|ttf)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

[[deployment.matchers]]
pattern = "^.+\\.(html|xml|json)$"
gzip = true

# Generate Netlify redirects file in Hugo
# Example taken from: https://github.com/gohugoio/hugoDocs/commit/c1ab9894e8292e0a74c43bbca2263b1fb3840f9e
[mediaTypes]
[mediaTypes."text/netlify"]
suffixes = [""]
delimiter = ""

[outputFormats]
[outputFormats.REDIR]
mediatype = "text/netlify"
baseName = "_redirects"
isPlainText = true
notAlternative = true

# The docs index for LLMs / AI coding assistants, following the llms.txt
# convention (https://llmstxt.org/): every guide page and every API reference
# package, each linked to its Markdown version (index.md, the theme's MARKDOWN
# format, [outputs] above). IDE agents (Cursor, Windsurf, Claude Code, Copilot, ...) look for
# /llms.txt by name. Rendered natively by Hugo on every build
# (layouts/index.llms.txt), no external script required. The template finds the
# docs root through params.homeSlug and fails the build when it is not a
# section, so it never ships an empty file silently.
# Tests: scripts/tests/llms-exports.test.ts.
[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[security.funcs]
getenv = ['^HUGO_', '^CI$', '^hugo_env$']

# External programs the build may run. Hugo 0.167 stopped allowing tailwindcss by default, and the
# theme's css.TailwindCSS calls it (node and npx run its npm package).
[security.exec]
allow = ['^tailwindcss$', '^node$', '^npx$', '^git$']

# resources.GetRemote is otherwise unrestricted by default. The footer partial
# is the only remote fetch this site makes, so pin it to the host that serves
# the footer definition; anything else fails loudly rather than silently
# reaching the network from a docs build.
[security.http]
urls = ['^https://www\.gooddata\.ai/learn-assets/']
